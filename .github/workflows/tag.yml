name: tag

# Creates a release tag. A release covers a whole alpha series: every commit
# sharing an X.N.V belongs to it, and the tag is cut at the last of them, so the
# commit counter is normally not zero.
#
# Two ways in. Writing a version into .github/release-version and pushing to
# main cuts that release, which is the ordinary route and needs nothing beyond a
# push. Dispatching by hand does the same and adds a force switch, for the times
# when a guard is in the way on purpose.
#
# The tag is pushed with the default GITHUB_TOKEN, which does not start another
# workflow. release.yml is therefore called directly rather than waiting for the
# tag event that would never arrive.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to tag, as X.N.V.M (for example 0.1.0.0)"
        required: true
        type: string
      force:
        description: "Skip the series and green-checks guards"
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths: [".github/release-version"]

permissions:
  contents: write
  actions: read

jobs:
  tag:
    name: create tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve the version to release
        id: resolve
        env:
          DISPATCHED: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [ -n "${DISPATCHED:-}" ]; then
            version="$DISPATCHED"
            echo "Releasing $version, dispatched by hand."
          else
            # The first line that is neither blank nor a comment.
            version=$(grep -vE '^\s*(#|$)' .github/release-version | head -n1 | tr -d '[:space:]')
            echo "Releasing $version, read from .github/release-version."
          fi

          if [ -z "$version" ]; then
            echo "no version to release" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

          # Between releases the marker names the last one cut, so a push that
          # touches this file for any other reason finds its version already
          # tagged. That is the steady state rather than a mistake, so the run
          # stops here and succeeds. Asking for it by hand is different: the
          # answer to "release this now" cannot be silence.
          if git rev-parse "v$version" >/dev/null 2>&1; then
            if [ -n "${DISPATCHED:-}" ]; then
              echo "tag v$version already exists" >&2
              exit 1
            fi
            echo "v$version is already released. Nothing to do."
            echo "pending=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "pending=true" >> "$GITHUB_OUTPUT"

      # Nothing human stands between the decision to release and the tag any
      # more, so the checks have to. Gated on workflow names rather than on the
      # names of individual check runs, because lint, typecheck, test (python
      # 3.12) and the compat matrix all move whenever a job or a matrix changes,
      # and a gate that named them would quietly stop gating.
      - name: Require ci and compat to be green
        if: steps.resolve.outputs.pending == 'true' && inputs.force != true
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          deadline=$(( SECONDS + 900 ))
          required="ci compat"

          while :; do
            waiting=""
            for workflow in $required; do
              # Most recent run for this workflow on this commit: a re-run
              # leaves several, and the last one is the one that counts.
              state=$(gh api "repos/${REPO}/actions/runs?head_sha=${SHA}&per_page=100" \
                --jq "[.workflow_runs[] | select(.name == \"${workflow}\")]
                      | sort_by(.run_started_at) | last
                      | if . == null then \"absent\"
                        elif .status != \"completed\" then .status
                        else .conclusion end")

              case "$state" in
                success)
                  ;;
                # Absent is not passing. The push that started this release
                # started ci and compat too, so for the first few seconds they
                # do not exist yet.
                absent|queued|in_progress|waiting|pending|requested)
                  waiting="$waiting $workflow($state)"
                  ;;
                cancelled)
                  echo "refusing to tag ${SHA}: ${workflow} was cancelled" >&2
                  echo "ci cancels in progress runs when a newer commit lands, so main has" >&2
                  echo "moved and this commit is no longer the head of anything" >&2
                  exit 1
                  ;;
                *)
                  echo "refusing to tag ${SHA}: ${workflow} concluded ${state}" >&2
                  exit 1
                  ;;
              esac
            done

            if [ -z "$waiting" ]; then
              echo "ci and compat are green for ${SHA}."
              break
            fi

            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "refusing to tag ${SHA}: still waiting on${waiting} after 15 minutes" >&2
              exit 1
            fi

            echo "waiting on${waiting}"
            sleep 15
          done

      - name: Validate the version and create the tag
        id: check
        if: steps.resolve.outputs.pending == 'true'
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail

          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "version must be X.N.V.M, got '$VERSION'" >&2
            exit 1
          fi

          packaged=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          if [ "$VERSION" != "$packaged" ]; then
            echo "version $VERSION does not match pyproject.toml, which reports $packaged" >&2
            echo "bump the version in the commit that describes the change, then tag it" >&2
            exit 1
          fi

          # One release per alpha series. The commit counter is free to be
          # anything, because the tag is cut at the last commit of the series,
          # but cutting a second release for a series already tagged would
          # leave two releases claiming the same version.
          series="${VERSION%.*}"
          existing=$(git tag --list "v${series}.*" | head -n1)
          if [ -n "$existing" ] && [ "$FORCE" != "true" ]; then
            echo "refusing to tag $VERSION: series $series is already released as $existing" >&2
            echo "bump the alpha component for a new release, or rerun with force" >&2
            exit 1
          fi

          tag="v$VERSION"
          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "tag $tag already exists" >&2
            exit 1
          fi

          git config user.name "Stiven-Gjekaj"
          git config user.email "stivenagostingjekaj@gmail.com"
          git tag -a "$tag" -m "stenos $VERSION"
          git push origin "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  release:
    name: release
    needs: tag
    # Empty when the marker named a version that was already released, which
    # is every push that touches the file for any other reason.
    if: needs.tag.outputs.tag != ''
    uses: ./.github/workflows/release.yml
    permissions:
      contents: write
    with:
      tag: ${{ needs.tag.outputs.tag }}
