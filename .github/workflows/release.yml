name: release

# Builds a standalone executable for each supported platform and attaches
# them, with the installers and one checksum file, to a GitHub release.
#
# No wheel and no source distribution. Stenos is a program to run, not a
# library to import, so those would be noise beside the executables.
#
# Tags are created only on a major, beta, or alpha version bump, never on the
# commit counter. See the versioning section of the README.
#
# The workflow_call trigger exists because a tag pushed with the default
# GITHUB_TOKEN does not start another workflow. tag.yml therefore calls this
# workflow directly instead of relying on the tag event.
#
# workflow_dispatch is here so the whole build can be proven without creating a
# tag. A tag is a public, permanent-looking thing to create by accident, and a
# release workflow that can only be tested by tagging gets tested in
# production. On a manual run with no tag everything runs except the one step
# that creates the release, so the download, the checksums, and the note
# extraction are all proven and the archives are left as workflow artifacts.

on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      tag:
        description: Tag to release
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release, or empty to build without publishing
        required: false
        type: string

permissions:
  contents: write

jobs:
  verify:
    name: verify the version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Verify the tag matches the packaged version
        if: inputs.tag || startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          tag="${{ inputs.tag }}"
          [ -n "$tag" ] || tag="${GITHUB_REF#refs/tags/}"
          packaged=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          if [ "$tag" != "v$packaged" ]; then
            echo "tag $tag does not match pyproject version $packaged" >&2
            exit 1
          fi

  executables:
    name: executable ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing should not hide whether the others work. On a real
      # release every platform has to succeed anyway, and knowing which ones
      # broke is worth more than stopping early.
      fail-fast: false
      matrix:
        include:
          # A runner of the target's own architecture in every case. A freezer
          # cannot cross-build: it packages the interpreter and the compiled
          # extension modules of the machine it runs on.
          #
          # Intel macOS is absent for that reason combined with GitHub having
          # withdrawn its Intel runners. There is no honest way to produce that
          # executable here, so it is not claimed.
          - target: linux-x86_64
            os: ubuntu-latest
          - target: linux-arm64
            os: ubuntu-24.04-arm
          - target: macos-arm64
            os: macos-latest
          - target: windows-x86_64
            os: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install libopus on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libopus0 libsodium23

      - name: Install libopus on macOS
        if: runner.os == 'macOS'
        run: brew install opus

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: "3.12"

      - name: Install the project and the freezer
        # The executable carries a transcription backend, without which it
        # could join a call but never transcribe it.
        run: uv sync --extra cuda --group freeze

      - name: Freeze
        run: uv run pyinstaller packaging/stenos.spec --noconfirm

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          name="stenos-${{ matrix.target }}"
          mkdir -p "package/$name"
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp dist/stenos.exe "package/$name/"
          else
            cp dist/stenos "package/$name/"
            chmod +x "package/$name/stenos"
          fi
          cp README.md LICENSE .env.example "package/$name/"
          # Git Bash on the Windows runner has no zip. 7-Zip is preinstalled
          # there, and produces the same archive.
          if [ "$RUNNER_OS" = "Windows" ]; then
            (cd package && 7z a -tzip "$name.zip" "$name" > /dev/null)
          else
            (cd package && zip -qr "$name.zip" "$name")
          fi
          ls -la package

      # The executable is checked here rather than only at the end, so a broken
      # build is reported by the job that made it. --check exercises the parts
      # a freeze most often breaks: it loads libopus from the bundle and
      # imports the transcription backend.
      - name: Check the executable runs
        shell: bash
        env:
          DISCORD_TOKEN: smoke-test
        run: |
          set -euo pipefail
          binary="dist/stenos"
          [ "$RUNNER_OS" = "Windows" ] && binary="dist/stenos.exe"
          "$binary" --version
          "$binary" --help > /dev/null
          report=$("$binary" --check)
          echo "$report"
          echo "$report" | grep -q "opus loaded      True" \
            || { echo "the executable cannot load libopus" >&2; exit 1; }
          echo "$report" | grep -q "backend usable   True" \
            || { echo "the executable cannot import its transcription backend" >&2; exit 1; }
          # PyNaCl reaches the bundle only through a hidden import, because its
          # compiled module pulls in _cffi_backend from C where the freezer
          # cannot see it. Losing that leaves an executable that starts, reports
          # opus loaded, and can join no voice channel at all.
          if echo "$report" | grep -q "voice support unavailable"; then
            echo "the executable has no voice support, so it can join no channel" >&2
            echo "$report" | grep "receive repair" >&2
            exit 1
          fi
          # The certificate list has to come from inside the bundle. The paths
          # compiled into a frozen ssl module are those of this runner, which
          # exist here and nowhere else, so a build that falls back to them
          # passes every check made on the machine that built it and then fails
          # the TLS handshake on a user's. _MEI is the unpacked bundle.
          certs=$(echo "$report" | sed -n 's/^certificates *//p')
          echo "certificate list: $certs"
          case "$certs" in
            *_MEI*) ;;
            *) echo "the executable has no bundled certificates, so logging in would fail on any other machine" >&2
               exit 1 ;;
          esac

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: stenos-${{ matrix.target }}
          path: package/*.zip
          if-no-files-found: error

  publish:
    name: assemble the release
    needs: [verify, executables]
    runs-on: ubuntu-latest
    # No tag check on the job. Gating the whole thing meant a manual run never
    # exercised the artifact download, the checksums, or the note extraction,
    # which are the parts most likely to break. Only the final step, the one
    # step with a side effect, is gated on a tag.
    steps:
      # Before the download, not after. actions/checkout defaults to
      # clean: true, which runs git clean over the workspace and would delete
      # the archives if they were already there.
      #
      # This job builds nothing. It checks out for two reasons: the release
      # notes are read from CHANGELOG.md, and the installers are attached from
      # scripts/, and both must be the versions that release ships.
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Collect the archives
        uses: actions/download-artifact@v8
        with:
          path: assets
          merge-multiple: true

      # Only the executables and the installers. A release of a bot nobody
      # imports as a library is a place to download a program from, so the
      # wheel and the source distribution would be noise beside them.
      - name: Gather the installers
        run: |
          set -euo pipefail
          cp scripts/install.sh scripts/install.ps1 assets/
          ls -la assets

      # One file for all of them, so a user checks a download against a single
      # list rather than hunting for a per-file hash.
      - name: Write the checksums
        run: |
          set -euo pipefail
          cd assets
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Read the release notes
        run: |
          set -euo pipefail
          tag="${{ inputs.tag }}"
          if [ -z "$tag" ] && [ "$GITHUB_REF" != "${GITHUB_REF#refs/tags/}" ]; then
            tag="${GITHUB_REF#refs/tags/}"
          fi

          # A manual run with no tag has no release to name, so the notes are
          # read for the packaged version instead. That exercises the
          # extraction and reports whether the section a release of this commit
          # would need is actually present.
          if [ -n "$tag" ]; then
            version="${tag#v}"
          else
            version=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
            echo "No tag given. Reading notes for the packaged version ${version}."
          fi

          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "version '$version' is not X.N.V.M, so the release cannot be named" >&2
            exit 1
          fi

          # A release covers an alpha series rather than a single commit: every
          # commit sharing an X.N.V belongs to it. The series is what the
          # release is named and what the changelog is keyed on, so the commit
          # counter is dropped here.
          series="${version%.*}"

          # Which component last moved decides what the release is called. See
          # the versioning section of the README.
          IFS=. read -r _ beta alpha <<< "$series"
          if [ "${alpha:-0}" != "0" ]; then
            label="Alpha"
          elif [ "${beta:-0}" != "0" ]; then
            label="Beta"
          else
            label="Release"
          fi
          echo "label=$label" >> "$GITHUB_ENV"

          # An alpha is a pre-release. Marking it makes the distinction one
          # GitHub itself records, so the version badges resolve without anyone
          # having to remember to tick a box.
          if [ "$label" = "Alpha" ]; then
            echo "prerelease=--prerelease" >> "$GITHUB_ENV"
          else
            echo "prerelease=" >> "$GITHUB_ENV"
          fi
          notes="${RUNNER_TEMP}/release-notes.md"

          # Each . becomes [.] rather than being escaped with a backslash,
          # because awk implementations disagree about a backslash in a gsub
          # replacement. Left as a metacharacter, 0.1.1 would also match a
          # heading ## 0111.
          #
          # The series has to be followed by a space or the end of the line, so
          # a release of 0.1.1 does not take the 0.1.1-rc section.
          if [ -f CHANGELOG.md ]; then
            awk -v v="$series" '
              BEGIN { gsub(/\./, "[.]", v); heading = "^## " v "([ \t(]|$)" }
              $0 ~ heading { inside = 1; next }
              inside && /^## / { exit }
              inside { print }
            ' CHANGELOG.md > "$notes"
          else
            : > "$notes"
          fi

          # A heading with nothing under it is worth no more than no heading, so
          # this asks for content rather than for a file with bytes in it.
          # grep is avoided: it exits 1 when it matches nothing, and set -e
          # would end the job at the point the fallback is meant to run.
          if [ -n "$(tr -d '[:space:]' < "$notes")" ]; then
            echo "Notes for ${series} read from CHANGELOG.md ($(wc -l < "$notes") lines)."
          else
            echo "No '## ${series}' section in CHANGELOG.md. Falling back to generated notes."
          fi
          echo "tag=$tag" >> "$GITHUB_ENV"
          echo "series=$series" >> "$GITHUB_ENV"
          echo "notes=$notes" >> "$GITHUB_ENV"

      # A draft, not a published release. Publishing is a person's decision:
      # the notes are worth reading before anyone can download them, and a draft
      # can be deleted without leaving a version that the world briefly saw.
      # Publish from the Releases page when it looks right.
      #
      # The only step here that creates anything, and so the only one a tag
      # gates. A manual run stops at this point, having proven every step
      # before it.
      - name: Create the draft release
        if: inputs.tag || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -n "$(tr -d '[:space:]' < "$notes")" ]; then
            body=(--notes-file "$notes")
          else
            body=(--generate-notes)
          fi

          gh release create "$tag" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "$label v$series" \
            "${body[@]}" \
            --draft \
            ${prerelease} \
            assets/*
          echo "Draft release created. Review and publish it from the Releases page."
