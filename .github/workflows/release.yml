name: release

# Tags are created only on a major, beta, or alpha version bump, never on the
# commit counter. See the versioning section of the README.
#
# The workflow_call trigger exists because a tag pushed with the default
# GITHUB_TOKEN does not start another workflow. tag.yml therefore calls this
# workflow directly instead of relying on the tag event.

on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      tag:
        description: Tag to release
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Resolve the tag being released
        id: tag
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Verify the tag matches the packaged version
        run: |
          tag="${{ steps.tag.outputs.name }}"
          packaged=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          if [ "$tag" != "v$packaged" ]; then
            echo "tag $tag does not match pyproject version $packaged" >&2
            exit 1
          fi

      - name: Build distributions
        run: uv build

      - name: Generate release notes from commit subjects
        run: |
          tag="${{ steps.tag.outputs.name }}"
          previous=$(git tag --sort=-version:refname | grep -v "^${tag}$" | head -n1 || true)
          {
            echo "## Changes"
            echo
            if [ -n "$previous" ]; then
              git log --no-merges --format='- %s' "${previous}..${tag}"
            else
              git log --no-merges --format='- %s' "${tag}"
            fi
            echo
            if [ -n "$previous" ]; then
              echo "**Full changelog**: https://github.com/${{ github.repository }}/compare/${previous}...${tag}"
            fi
          } > release-notes.md
          cat release-notes.md

      - name: Create the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: ${{ steps.tag.outputs.name }}
          body_path: release-notes.md
          files: |
            dist/*.whl
            dist/*.tar.gz
