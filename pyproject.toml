[project]
name = "stenos"
version = "0.1.1.0"
description = "Discord voice recorder producing timestamped, speaker-attributed transcripts with local inference"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "Stiven-Gjekaj", email = "stivenagostingjekaj@gmail.com" }]
keywords = ["discord", "transcription", "whisper", "voice", "stenography"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "py-cord[voice]>=2.8.1,<3",
    "numpy>=1.26",
    "python-dotenv>=1.0",
]

[project.scripts]
stenos = "stenos.bot:main"

[project.optional-dependencies]
mlx = ["mlx-whisper>=0.4"]
cuda = ["faster-whisper>=1.1"]

[project.urls]
Homepage = "https://github.com/Stiven-Gjekaj/stenos"
Repository = "https://github.com/Stiven-Gjekaj/stenos"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stenos"]

[tool.hatch.build.targets.sdist]
include = ["src/stenos", "tests", "README.md", "LICENSE", "pyproject.toml"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "C4", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
# The target version deliberately follows the running interpreter. numpy ships
# different stubs per Python version, and its 3.12 stubs use PEP 695 type
# statements that mypy rejects when told to target an earlier version.
warn_unused_configs = true
warn_redundant_casts = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["discord.*", "mlx_whisper.*", "faster_whisper.*", "scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not compat'"
asyncio_mode = "auto"
markers = [
    "compat: cross-platform compatibility checks, run explicitly with -m compat",
]

[tool.coverage.run]
source = ["stenos"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
